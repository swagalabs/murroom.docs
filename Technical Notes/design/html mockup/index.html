<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3EFF5">
  <title>Beauty UI Mockup</title>
  <style>
:root {
  --accent: #8A4F7D;
  --muted: #7D7582;
  --line: #E9DCEB;
  --surface: #FFFFFF;
  --canvas: #F3EFF5;
  --phone-border: #1F1A24;
}

* { box-sizing: border-box; }

html, body { min-width: 320px; min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--canvas);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  transition: background-color .2s ease;
}

body[data-theme="dark"] {
  --accent: #C38EB7;
  --muted: #A79EAB;
  --line: #382D40;
  --surface: #231A29;
  --canvas: #100B14;
  --phone-border: #08060A;
}

button { font: inherit; }

.phone {
  position: relative;
  width: min(390px, calc(100vw - 28px));
  aspect-ratio: 390 / 844;
  overflow: hidden;
  border: clamp(5px, 1.8vw, 7px) solid var(--phone-border);
  border-radius: clamp(34px, 10vw, 46px);
  background: var(--surface);
  box-shadow: 0 28px 80px rgba(40, 20, 40, .22), 0 4px 16px rgba(40, 20, 40, .12);
  transition: border-color .2s ease, background-color .2s ease;
}

.viewport {
  position: absolute;
  inset: 0 0 8.0569%;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  background: var(--canvas);
}

.viewport::-webkit-scrollbar { display: none; }

.phone.is-overlay .viewport { inset: 0; }
.phone.is-overlay .bottom-nav { display: none; }

.page-art {
  position: relative;
  width: 100%;
  min-height: 100%;
  overflow: hidden;
  background: var(--canvas);
}

.page-art img {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
  -webkit-user-drag: none;
}

.hotspots { position: absolute; inset: 0; pointer-events: none; }

.hotspot {
  position: absolute;
  border: 0;
  padding: 0;
  opacity: 0;
  cursor: pointer;
  pointer-events: auto;
}

.bottom-nav {
  position: absolute;
  z-index: 10;
  inset: auto 0 0;
  height: 8.0569%;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--line);
  background: var(--surface);
  transition: background-color .2s ease, border-color .2s ease;
}

.bottom-nav button {
  min-width: 0;
  border: 0;
  padding: 7px 0 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 2px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.nav-icon {
  width: 42px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 15px;
}

.nav-icon svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.bottom-nav small {
  max-width: 100%;
  overflow: hidden;
  font-size: clamp(7px, 2.3vw, 9px);
  line-height: 1;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.bottom-nav button.is-active { color: var(--accent); }
.bottom-nav button.is-active .nav-icon { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.bottom-nav button.is-active small { font-weight: 700; }

.page-art.is-changing { opacity: .78; }

@media (max-height: 880px) and (min-width: 430px) {
  .phone {
    height: calc(100vh - 28px);
    width: auto;
  }
}

@media (prefers-reduced-motion: no-preference) {
  .page-art { transition: opacity .14s ease; }
}

</style>
</head>
<body data-theme="light">

  search: [[20, 876, 350, 82], [20, 968, 350, 82], [20, 1060, 350, 82]],
  favorites: [
    [20, 198, 350, 190], [20, 408, 350, 190], [20, 618, 350, 190],
    [20, 828, 350, 190], [20, 1038, 350, 190], [20, 1248, 350, 190],
  ],
};

const phone = document.querySelector('.phone');
const viewport = document.querySelector('#viewport');
const pageArt = document.querySelector('#pageArt');
const screenImage = document.querySelector('#screenImage');
const hotspots = document.querySelector('#hotspots');
const navButtons = [...document.querySelectorAll('[data-page]')];
const scrollPositions = Object.fromEntries(Object.keys(pages).map((key) => [key, 0]));
const pageHistory = [];

let currentPage = Object.hasOwn(pages, location.hash.slice(1)) ? location.hash.slice(1) : 'welcome';
let currentTheme = localStorage.getItem('beauty-theme') === 'dark' ? 'dark' : 'light';
let swipeStart = null;
let cartState = 'master';

function assetPath(page) {
  const file = page === 'cart' ? cartStates[cartState].file : pages[page].file;
  const assetKey = `${file}-${currentTheme}`;
  return globalThis.EMBEDDED_ASSETS?.[assetKey] ?? `assets/${file}-ua-${currentTheme}-full.svg`;
}

function addHotspot({ label, left, top, width, height, action }) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'hotspot';
  button.setAttribute('aria-label', label);
  button.style.left = `${left / 390 * 100}%`;
  button.style.top = `${top / pages[currentPage].contentHeight * 100}%`;
  button.style.width = `${width / 390 * 100}%`;
  button.style.height = `${height / pages[currentPage].contentHeight * 100}%`;
  button.addEventListener('click', action);
  hotspots.append(button);
}

function setTheme(theme) {
  currentTheme = theme;
  document.body.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#100B14' : '#F3EFF5';
  localStorage.setItem('beauty-theme', theme);
  screenImage.src = assetPath(currentPage);
}

function openOverlay(page) {
  if (!pages[page]?.overlay) return;
  if (page === 'cart') {
    cartState = 'master';
    pages.cart.contentHeight = cartStates.master.contentHeight;
  }
  pageHistory.push(currentPage);
  showPage(page);
}

function setCartState(state) {
  if (!Object.hasOwn(cartStates, state)) return;
  cartState = state;
  pages.cart.contentHeight = cartStates[state].contentHeight;
  pageArt.classList.add('is-changing');
  pageArt.style.aspectRatio = `390 / ${pages.cart.contentHeight}`;
  screenImage.src = assetPath('cart');
  buildHotspots();
  requestAnimationFrame(() => pageArt.classList.remove('is-changing'));
}

function goBack() {
  showPage(pageHistory.pop() ?? 'home');
}

function buildHotspots() {
  hotspots.replaceChildren();

  salonCardHotspots[currentPage]?.forEach(([left, top, width, height]) => {
    addHotspot({ label: 'Відкрити сторінку салону', left, top, width, height, action: () => openOverlay('salon') });
  });

  if (currentPage === 'home') {
    addHotspot({ label: 'Перейти до пошуку', left: 20, top: 118, width: 350, height: 52, action: () => showPage('search') });
    addHotspot({ label: 'Змінити адресу', left: 16, top: 52, width: 110, height: 56, action: () => openOverlay('address') });
    addHotspot({ label: 'Відкрити категорію манікюру', left: 88, top: 238, width: 72, height: 92, action: () => openOverlay('category') });
  }

  if (currentPage === 'profile') {
    addHotspot({ label: 'Увімкнути світлу тему', left: 29, top: 750, width: 156, height: 60, action: () => setTheme('light') });
    addHotspot({ label: 'Увімкнути темну тему', left: 205, top: 750, width: 156, height: 60, action: () => setTheme('dark') });
  }

  if (currentPage === 'welcome') {
    addHotspot({ label: 'Створити акаунт', left: 20, top: 552, width: 350, height: 58, action: () => openOverlay('registration') });
    addHotspot({ label: 'Увійти', left: 20, top: 624, width: 350, height: 58, action: () => showPage('home') });
  }

  if (currentPage === 'registration') {
    addHotspot({ label: 'Повернутися назад', left: 14, top: 46, width: 48, height: 48, action: goBack });
    addHotspot({ label: 'Створити акаунт', left: 20, top: 944, width: 350, height: 58, action: () => showPage('home') });
  }

  if (currentPage === 'address') {
    addHotspot({ label: 'Повернутися назад', left: 14, top: 46, width: 48, height: 48, action: goBack });
    addHotspot({ label: 'Обрати адресу у Львові', left: 20, top: 448, width: 350, height: 76, action: goBack });
  }

  if (currentPage === 'category') {
    addHotspot({ label: 'Повернутися назад', left: 14, top: 46, width: 48, height: 48, action: goBack });
    [[20, 224, 350, 154], [20, 440, 350, 82], [20, 802, 350, 174], [20, 1028, 350, 276]].forEach(([left, top, width, height]) => {
      addHotspot({ label: 'Відкрити сторінку салону', left, top, width, height, action: () => openOverlay('salon') });
    });
  }

  if (currentPage === 'bookings') {
    addHotspot({ label: 'Відкрити деталі найближчого запису', left: 20, top: 196, width: 350, height: 130, action: () => openOverlay('booking-detail') });
    addHotspot({ label: 'Оцінити завершену процедуру', left: 20, top: 362, width: 350, height: 130, action: () => openOverlay('procedure-review') });
  }

  if (currentPage === 'booking-detail') {
    addHotspot({ label: 'Повернутися до записів', left: 14, top: 52, width: 48, height: 48, action: goBack });
    addHotspot({ label: 'Змінити дату й час запису', left: 244, top: 310, width: 122, height: 48, action: () => openOverlay('booking-reschedule') });
    addHotspot({ label: 'Скасувати запис', left: 20, top: 1080, width: 350, height: 54, action: () => openOverlay('booking-cancel') });
  }

  if (currentPage === 'booking-reschedule') {
    addHotspot({ label: 'Закрити перенесення запису', left: 326, top: 748, width: 44, height: 44, action: goBack });
    addHotspot({ label: 'Зберегти новий час', left: 30, top: 1110, width: 330, height: 54, action: goBack });
  }

  if (currentPage === 'booking-cancel') {
    addHotspot({ label: 'Закрити підтвердження', left: 320, top: 466, width: 44, height: 44, action: goBack });
    addHotspot({ label: 'Підтвердити скасування запису', left: 40, top: 706, width: 310, height: 50, action: () => { pageHistory.length = 0; showPage('home'); } });
  }

  if (currentPage === 'salon') {
    addHotspot({ label: 'Повернутися назад', left: 14, top: 10, width: 44, height: 44, action: goBack });
    addHotspot({ label: 'Детальніше про салон', left: 132, top: 314, width: 126, height: 48, action: () => openOverlay('salon-about') });
    addHotspot({ label: 'Переглянути оцінки та відгуки', left: 20, top: 478, width: 118, height: 86, action: () => openOverlay('reviews') });
    addHotspot({ label: 'Пошук послуг салону', left: 20, top: 674, width: 175, height: 54, action: () => openOverlay('service-search') });
    addHotspot({ label: 'Категорії послуг салону', left: 195, top: 674, width: 175, height: 54, action: () => openOverlay('salon-categories') });
    addHotspot({ label: 'Переглянути кошик', left: 20, top: 2632, width: 350, height: 56, action: () => openOverlay('cart') });
  }

  if (currentPage === 'salon-about') {
    addHotspot({ label: 'Повернутися до салону', left: 14, top: 46, width: 48, height: 48, action: goBack });
    addHotspot({ label: 'Переглянути оцінки та відгуки', left: 28, top: 930, width: 330, height: 98, action: () => openOverlay('reviews') });
  }

  if (currentPage === 'service-search') {
    addHotspot({ label: 'Повернутися до салону', left: 14, top: 46, width: 48, height: 48, action: goBack });
  }

  if (currentPage === 'salon-categories') {
    addHotspot({ label: 'Повернутися до салону', left: 14, top: 46, width: 48, height: 48, action: goBack });
    [184, 268, 352].forEach((top) => {
      addHotspot({ label: 'Відкрити послуги категорії', left: 20, top, width: 350, height: 72, action: () => openOverlay('category-services') });
    });
  }

  if (currentPage === 'category-services') {
    addHotspot({ label: 'Повернутися до категорій', left: 14, top: 46, width: 48, height: 48, action: goBack });
  }

  if (currentPage === 'reviews') {
    addHotspot({ label: 'Повернутися до салону', left: 14, top: 46, width: 48, height: 48, action: goBack });
  }

  if (currentPage === 'procedure-review') {
    addHotspot({ label: 'Надіслати відгук', left: 20, top: 802, width: 350, height: 56, action: () => showPage('bookings') });
  }

  if (currentPage === 'cart') {
    addHotspot({ label: 'Закрити кошик', left: 140, top: 0, width: 110, height: 38, action: goBack });
    addHotspot({ label: 'Додати ще послуги', left: 20, top: 340, width: 350, height: 46, action: goBack });
    if (cartState === 'master') {
      [20, 142, 264].forEach((left) => {
        addHotspot({ label: 'Обрати майстра', left, top: 444, width: 112, height: 116, action: () => setCartState('picker') });
      });
    }
    if (cartState === 'picker') {
      addHotspot({ label: 'Обрати 25 серпня', left: 78, top: 664, width: 38, height: 40, action: () => {} });
      [36, 114, 192, 270].forEach((left) => {
        addHotspot({ label: 'Обрати час прийому', left, top: 736, width: 70, height: 42, action: () => setCartState('selected') });
      });
    }
    if (cartState === 'selected') {
      addHotspot({ label: 'Змінити дату й час', left: 270, top: 696, width: 96, height: 44, action: () => setCartState('picker') });
      addHotspot({ label: 'Оплатити замовлення', left: 20, top: 1854, width: 350, height: 60, action: () => openOverlay('payment-success') });
    }
  }

  if (currentPage === 'payment-success') {
    addHotspot({ label: 'Переглянути запис', left: 20, top: 704, width: 350, height: 54, action: () => showPage('bookings') });
    addHotspot({ label: 'На головну', left: 20, top: 770, width: 350, height: 54, action: () => showPage('home') });
  }

  if (currentPage === 'cancel-confirm') {
    addHotspot({ label: 'Повернутися до записів', left: 14, top: 46, width: 48, height: 48, action: goBack });
    addHotspot({ label: 'Підтвердити скасування', left: 20, top: 714, width: 350, height: 54, action: () => showPage('bookings') });
    addHotspot({ label: 'Залишити запис', left: 20, top: 780, width: 350, height: 54, action: goBack });
  }
}

function showPage(page, { updateHash = true } = {}) {
  if (!Object.hasOwn(pages, page)) return;

  scrollPositions[currentPage] = viewport.scrollTop;
  currentPage = page;
  const isOverlay = Boolean(pages[page].overlay);

  phone.classList.toggle('is-overlay', isOverlay);
  pageArt.classList.add('is-changing');
  pageArt.style.aspectRatio = `390 / ${pages[page].contentHeight}`;
  screenImage.src = assetPath(page);
  screenImage.alt = pages[page].label;
  buildHotspots();

  navButtons.forEach((button) => {
    const active = !isOverlay && button.dataset.page === page;
    button.classList.toggle('is-active', active);
    if (active) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });

  requestAnimationFrame(() => {
    viewport.scrollTop = scrollPositions[page];
    pageArt.classList.remove('is-changing');
  });

  if (updateHash) history.replaceState(null, '', `#${page}`);
}

navButtons.forEach((button) => button.addEventListener('click', () => {
  pageHistory.length = 0;
  showPage(button.dataset.page);
}));

window.addEventListener('hashchange', () => {
  pageHistory.length = 0;
  showPage(location.hash.slice(1), { updateHash: false });
});

window.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && pages[currentPage].overlay) {
    goBack();
    return;
  }
  if (!['ArrowLeft', 'ArrowRight'].includes(event.key) || pages[currentPage].overlay) return;
  const keys = Object.keys(pages).filter((key) => !pages[key].overlay);
  const direction = event.key === 'ArrowRight' ? 1 : -1;
  const nextIndex = (keys.indexOf(currentPage) + direction + keys.length) % keys.length;
  pageHistory.length = 0;
  showPage(keys[nextIndex]);
});

viewport.addEventListener('pointerdown', (event) => {
  if (!pages[currentPage].overlay || viewport.scrollTop > 4) return;
  swipeStart = { x: event.clientX, y: event.clientY };
});

viewport.addEventListener('pointerup', (event) => {
  if (!swipeStart) return;
  const deltaX = Math.abs(event.clientX - swipeStart.x);
  const deltaY = event.clientY - swipeStart.y;
  swipeStart = null;
  if (deltaY > 80 && deltaX < 90) goBack();
});

viewport.addEventListener('pointercancel', () => { swipeStart = null; });

document.body.dataset.theme = currentTheme;
showPage(currentPage, { updateHash: false });

</script>
</body>
</html>
